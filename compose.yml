services:
  postgres:
    image: ${DOCKER_REGISTRY:-docker.io}/postgres:16-alpine
    container_name: desk-sharing-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-desk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desk}
      POSTGRES_DB: ${POSTGRES_DB:-desk}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-desk} -d ${POSTGRES_DB:-desk}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prod-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        - DOCKER_REGISTRY=${DOCKER_REGISTRY:-docker.io}
        - PYPI_INDEX_URL=${PYPI_INDEX_URL:-https://pypi.org/simple}
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - NO_PROXY=${NO_PROXY:-}
    container_name: desk-sharing-backend
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prod-network
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-desk}:${POSTGRES_PASSWORD:-desk}@postgres:5432/${POSTGRES_DB:-desk}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Berlin}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - DOCKER_REGISTRY=${DOCKER_REGISTRY:-docker.io}
        - NPM_REGISTRY=${NPM_REGISTRY:-https://registry.npmjs.org/}
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - NO_PROXY=${NO_PROXY:-}
    container_name: desk-sharing-frontend
    ports:
      - "80:80"
    networks:
      - prod-network
    depends_on:
      - backend

volumes:
  postgres-data: {}

networks:
  prod-network:
    driver: bridge
